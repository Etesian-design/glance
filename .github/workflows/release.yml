# SPDX-License-Identifier: Apache-2.0
# Releases of the APK for stock Android (the ROM builds in its own platform-signed copy). go-semantic-release reads the
# Conventional Commits since the last tag (feat = minor, fix = patch; below 1.0 a breaking change is a minor bump; docs,
# ci, chore... release nothing; the first is v0.1.0). Built on GitHub's runners and signed with Glance's own key, kept
# as repository secrets: GLANCE_KEYSTORE (the .p12, base64) and GLANCE_KEYSTORE_PASS. Only a finished, signed build
# makes the tag and the release, with the APK and its SHA-256.
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glance-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Etesian-design/glance'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install semantic-release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/semantic-release" https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64
          echo "b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3  $RUNNER_TEMP/semantic-release" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/semantic-release"
      - name: Next version
        id: next
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f   # v1
        with:
          dry: 'true'
          allow-initial-development-versions: 'true'
          bin: ${{ runner.temp }}/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and sign
        if: steps.next.outputs.version != ''
        env:
          KS: ${{ secrets.GLANCE_KEYSTORE }}
          KS_PASS: ${{ secrets.GLANCE_KEYSTORE_PASS }}
          V: ${{ steps.next.outputs.version }}
        run: |
          ./gradlew --no-daemon -q -PglanceVersion="$V" :app:testDebugUnitTest :app:assembleRelease
          printf %s "$KS" | base64 -d > "$RUNNER_TEMP/glance.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p release; A="release/EtesianGlance-$V.apk"
          "$BT/apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/glance.p12" --ks-pass env:KS_PASS \
            --out "$A" app/build/outputs/apk/release/*.apk
          rm -f "$RUNNER_TEMP/glance.p12"
          "$BT/apksigner" verify "$A"
          (cd release && sha256sum "$(basename "$A")" > "$(basename "$A").sha256")
      - name: Release
        id: semrel
        if: steps.next.outputs.version != ''
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f   # v1
        with:
          allow-initial-development-versions: 'true'
          bin: ${{ runner.temp }}/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload
        if: steps.semrel.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          [ "$VERSION" = "${{ steps.next.outputs.version }}" ] || { echo "released $VERSION, built ${{ steps.next.outputs.version }}" >&2; exit 1; }
          gh release upload "v$VERSION" release/*
