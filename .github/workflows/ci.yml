# SPDX-License-Identifier: Apache-2.0
# Every push and pull request: Conventional Commits (commitlint.config.mjs, also a local git hook after npm install),
# the unit tests (matching, parsing, ranking) and a release build. Runs on GitHub's own runners.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: |
          from=${{ github.event.before }}
          if ! git merge-base --is-ancestor "$from" ${{ github.sha }} 2>/dev/null; then
            from=$(git merge-base "$from" ${{ github.sha }} 2>/dev/null || git rev-list --max-parents=0 ${{ github.sha }})
          fi
          npx commitlint --from "$from" --to ${{ github.sha }} --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Unit tests and release build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glance
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
