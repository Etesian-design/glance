[versions]
agp = "9.4.1"
coreKtx = "1.10.1"
junit = "4.13.2"
recyclerview = "1.3.2"
appcompat = "1.6.1"
preference = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# The JVM unit tests run the parsers and the ranking without Android: these stand in for the platform's own.
kxml2 = { group = "net.sf.kxml", name = "kxml2", version = "2.3.0" }
json = { group = "org.json", name = "json", version = "20240303" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
