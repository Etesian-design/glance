    <rect x="34" y="28" width="34" height="17" rx="3" fill="url(#pic)"/>
    <path d="M34 39l8-6 6 4 7-6 13 10v4H34z" fill="#fff" opacity=".35"/>
    <rect x="34" y="50" width="34" height="4" rx="2" fill="#2B2F3A"/>
    <rect x="34" y="57" width="26" height="3" rx="1.5" fill="#8A93A6"/>
    <rect x="34" y="63" width="30" height="3" rx="1.5" fill="#8A93A6"/>
    <rect x="34" y="69" width="18" height="3" rx="1.5" fill="#8A93A6"/>
  </g>
  <!-- the lens: a glance at the story -->
  <circle cx="66" cy="66" r="15.5" fill="#1A0630" opacity=".45" filter="url(#sh)" transform="translate(1 3)"/>
  <circle cx="66" cy="66" r="13" fill="#F2FAFF" opacity=".8"/>
  <circle cx="66" cy="66" r="13" fill="url(#glass)"/>
  <circle cx="66" cy="66" r="13" fill="none" stroke="url(#ring)" stroke-width="4.6"/>
  <circle cx="66" cy="66" r="15.3" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/>
  <ellipse cx="61" cy="60.5" rx="5" ry="2.6" fill="#fff" opacity=".9" transform="rotate(-35 61 60.5)"/>
  <circle cx="71.5" cy="71" r="1.4" fill="#fff" opacity=".7"/>
</g>
