  <radialGradient id="hl" cx="50" cy="-6" r="70" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EEFB"/></linearGradient>
  <linearGradient id="pic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39D0C9"/><stop offset="1" stop-color="#1E7FE0"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CD6FF"/><stop offset="1" stop-color="#1450C8"/></linearGradient>
  <radialGradient id="glass" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".55" stop-color="#DDF4FF" stop-opacity=".18"/><stop offset="1" stop-color="#9AD6FF" stop-opacity=".3"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
