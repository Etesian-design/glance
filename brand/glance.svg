  <rect width="100" height="100" fill="url(#hl)"/>
  <!-- the stack: two cards behind, fanned -->
  <rect x="24" y="22" width="44" height="54" rx="6" fill="#fff" opacity=".28" transform="rotate(-16 46 49)"/>
  <rect x="26" y="21" width="44" height="54" rx="6" fill="#fff" opacity=".5" transform="rotate(-7 48 48)"/>
  <!-- front card, its shadow first -->
  <rect x="29" y="23" width="44" height="54" rx="6" fill="#3A0E4A" opacity=".45" filter="url(#sh)" transform="translate(1.5 3) rotate(4 51 50)"/>
  <g transform="rotate(4 51 50)">
